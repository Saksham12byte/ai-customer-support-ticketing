# ===================================================================
# Production MySQL Configuration Profile
# Activate by running: java -jar target/*.jar --spring.profiles.active=mysql
# Or setting in application.properties: spring.profiles.active=mysql
# ===================================================================

server.port=8080

# MySQL Connection Details
# Ensure database 'ticketdb' is created first: CREATE DATABASE ticketdb;
spring.datasource.url=jdbc:mysql://localhost:3306/ticketdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate MySQL Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 Console in MySQL mode
spring.h2.console.enabled=false
