# ===================================================================
# AI-Powered Customer Support Ticketing System - Configuration
# ===================================================================

# Application Server
server.port=8080
spring.application.name=ai-customer-support-ticketing

# Database Configuration (Default: H2 In-Memory with persistence support)
spring.datasource.url=jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console for Capstone Viva & Database Inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# AI Integration Settings
# Set your Gemini API key below or via environment variable GEMINI_API_KEY
# If left blank, the application automatically runs in High-Accuracy Rule-Based Demo Mode
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Logging
logging.level.com.skillwallet.ticketing=INFO
